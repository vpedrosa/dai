<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Búsqueda anticipada</title>
        <!-- UnoCSS/Tailwind CDN - Práctica 5.2 -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@unocss/reset/tailwind.min.css">
        <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
        <script defer src="/static/js/busqueda-anticipada.js"></script>
    </head>
    <body class="bg-gray-100 min-h-screen">
        <!-- Header con logo estilo Mercadona -->
        <header class="bg-green-600 shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <a href="/" class="text-white text-2xl font-bold">
                        Tienda Online
                    </a>
                    <a href="/productos" class="text-white hover:text-green-200">
                        Ver todos los productos
                    </a>
                </div>
            </div>
        </header>

        <!-- Barra de búsqueda estilo Mercadona -->
        <section class="bg-white shadow-sm py-6">
            <div class="max-w-3xl mx-auto px-4">
                <div class="relative">
                    <!-- Input de búsqueda -->
                    <div class="flex items-center bg-gray-100 rounded-full px-4 py-3 border-2 border-transparent focus-within:border-green-500 focus-within:bg-white transition-all">
                        <!-- Icono de lupa -->
                        <svg class="w-5 h-5 text-gray-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <input
                            type="text"
                            id="buscador"
                            class="flex-1 bg-transparent outline-none text-gray-700 placeholder-gray-500"
                            placeholder="Buscar en Tienda Online..."
                            autocomplete="off"
                        />
                        <!-- Botón limpiar (oculto por defecto) -->
                        <button
                            id="btn-limpiar"
                            class="hidden text-gray-400 hover:text-gray-600 ml-2"
                            type="button"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Contador de resultados -->
                <div id="contador-resultados" class="mt-4 text-center text-gray-600 hidden">
                    Se encontraron <span id="num-resultados" class="font-bold text-green-600">0</span> productos
                </div>
            </div>
        </section>

        <!-- Contenedor de tarjetas de productos -->
        <main class="max-w-7xl mx-auto px-4 py-8">
            <div id="tarjetas" class="flex flex-wrap justify-center gap-4">
                <!-- Aquí se insertarán las tarjetas clonadas -->
            </div>

            <!-- Mensaje cuando no hay resultados -->
            <div id="sin-resultados" class="hidden text-center py-12">
                <svg class="w-16 h-16 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-gray-500 text-lg">No se encontraron productos</p>
                <p class="text-gray-400">Intenta con otros términos de búsqueda</p>
            </div>

            <!-- Mensaje inicial -->
            <div id="mensaje-inicial" class="text-center py-12">
                <svg class="w-16 h-16 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <p class="text-gray-600 text-lg">Escribe al menos 3 caracteres para buscar</p>
                <p class="text-gray-400">Los resultados aparecerán automáticamente</p>
            </div>
        </main>

        <!-- Template de tarjeta producto - Práctica 5.3 -->
        <template id="plantilla">
            <!-- Tarjeta producto estilo Mercadona con Tailwind -->
            <div class="max-w-sm rounded overflow-hidden w-64 bg-white hover:shadow-lg transition-shadow">
                <img class="w-10/12 h-48 object-contain mx-auto mt-4 bg-gray-50"
                     data-img
                     src=""
                     alt="">
                <div class="px-6 py-4">
                    <div class="mb-2 text-sm font-medium text-gray-800" data-text1></div>
                    <div class="text-xs text-gray-500 mb-2" data-text2></div>
                    <div class="text-xs text-green-600 mb-2" data-category></div>
                    <!-- Precio -->
                    <div class="flex items-baseline gap-2">
                        <span class="text-xl font-bold text-gray-900" data-precio></span>
                        <span class="text-sm text-gray-500" data-precio-texto></span>
                    </div>
                </div>
                <div class="px-6 pb-4 text-center">
                    <button class="w-full rounded-full px-4 py-2 text-sm text-green-700 border-2 border-green-600 hover:bg-green-50 transition-colors font-medium"
                            data-btn-carrito>
                        Añadir al carrito
                    </button>
                </div>
            </div>
        </template>

        <!-- Footer -->
        <footer class="bg-gray-800 text-white py-6 mt-auto">
            <div class="max-w-7xl mx-auto px-4 text-center">
                <p class="text-gray-400">Práctica 5 - DAI - Búsqueda Anticipada con TailwindCSS</p>
            </div>
        </footer>
    </body>
</html>
