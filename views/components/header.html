{# Header component #}
<header>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand" href="/">
                <strong>Tienda Online</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Buscador con Alpine.js -->
                <div class="search-wrapper mx-3 ms-auto"
                     x-data="searchComponent()"
                     @click.away="open = false">
                    <div class="position-relative">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text"
                               class="form-control search-input"
                               placeholder="Buscar productos..."
                               x-model="searchQuery"
                               @input.debounce.300ms="buscar()"
                               @focus="open = true"
                               @keydown.escape="open = false"
                               @keydown.enter.prevent="irABusqueda()"
                               @keydown.arrow-down.prevent="focusNext()"
                               @keydown.arrow-up.prevent="focusPrev()">

                        <!-- Dropdown de resultados -->
                        <div class="search-dropdown"
                             x-show="open && (resultados.length > 0 || cargando)"
                             x-transition
                             x-cloak>
                            <!-- Loading spinner -->
                            <div x-show="cargando" class="text-center py-3">
                                <div class="spinner-border spinner-border-sm" role="status">
                                    <span class="visually-hidden">Buscando...</span>
                                </div>
                            </div>

                            <!-- Resultados -->
                            <template x-if="!cargando && resultados.length > 0">
                                <div class="search-results">
                                    <template x-for="(producto, index) in resultados" :key="producto._id">
                                        <a :href="'/producto/' + producto._id"
                                           class="search-result-item"
                                           :class="{'active': index === focusedIndex}"
                                           @mouseenter="focusedIndex = index">
                                            <img :src="producto.imageUrl"
                                                 :alt="producto.text1"
                                                 class="search-result-image">
                                            <div class="search-result-info">
                                                <div class="search-result-title" x-text="producto.text1"></div>
                                                <div class="search-result-category" x-text="producto.category"></div>
                                            </div>
                                            <div class="search-result-price">
                                                <template x-if="producto.precioRebajado > 0">
                                                    <div>
                                                        <span class="text-muted text-decoration-line-through small" x-text="formatearPrecioConSufijo(producto.priceEuros, producto.priceText)"></span>
                                                        <span class="text-danger fw-bold" x-text="formatearPrecioConSufijo(producto.precioRebajado, producto.priceText)"></span>
                                                    </div>
                                                </template>
                                                <template x-if="producto.precioRebajado === 0">
                                                    <span class="fw-bold" x-text="formatearPrecioConSufijo(producto.priceEuros, producto.priceText)"></span>
                                                </template>
                                            </div>
                                        </a>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/productos">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if carrito.numProductos > 0 %}cart-with-items{% endif %}" href="/carrito">
                            <i class="bi bi-cart"></i>
                            Carrito
                            {% if carrito.numProductos > 0 %}
                            <span class="badge bg-primary ms-1">{{ carrito.numProductos }}</span>
                            <span class="cart-total ms-2">{{ carrito.totalCarrito | formatearPrecio }}</span>
                            {% endif %}
                        </a>
                    </li>
                    <li class="nav-item">
                        {% if usuario %}
                        <div class="nav-link">
                            <i class="bi bi-person-circle"></i>
                            <span class="fw-bold">{{ usuario }}</span>
                            <span class="mx-1">|</span>
                            <a href="/usuarios/logout" class="text-decoration-none text-danger">Salir</a>
                        </div>
                        {% else %}
                        <a class="nav-link" href="/usuarios/login">
                            <i class="bi bi-box-arrow-in-right"></i>
                            Identificarse
                        </a>
                        {% endif %}
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
